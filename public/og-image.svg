<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#090b10"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle Ambient Board Grid Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Golden Accent Frame Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#eab308" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Knight Crest Logo -->
  <g transform="translate(100, 110)">
    <rect width="84" height="84" rx="22" fill="url(#goldGradient)" filter="url(#goldGlow)"/>
    <text x="42" y="60" font-family="Cinzel, serif" font-size="52" fill="#090b10" font-weight="900" text-anchor="middle">♞</text>
    
    <text x="110" y="44" font-family="Cinzel, Georgia, serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">KNIGHTESLINE</text>
    <text x="110" y="74" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#eab308" letter-spacing="3">ONLINE CHESS ACADEMY</text>
  </g>

  <!-- Tagline & Heading -->
  <g transform="translate(100, 270)">
    <text x="0" y="0" font-family="Cinzel, Georgia, serif" font-size="54" font-weight="800" fill="#ffffff">
      Your Chess Era Starts Here.
    </text>
    <text x="0" y="64" font-family="Plus Jakarta Sans, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
      Master the royal game with titled Grandmasters and International Masters.
    </text>
    <text x="0" y="104" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="400" fill="#64748b">
      1-on-1 Mentorship • Tactical Puzzle Gym • Live Parent Progress Portal • From ₹799/mo
    </text>
  </g>

  <!-- Trust Badges & Metrics Strip -->
  <g transform="translate(100, 480)">
    <!-- Pill 1: Rating -->
    <rect x="0" y="0" width="220" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#eab308">★ 4.96</text>
    <text x="85" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">1,420+ Reviews</text>

    <!-- Pill 2: Faculty -->
    <rect x="240" y="0" width="240" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="265" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">GM &amp; IM</text>
    <text x="350" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">Certified Faculty</text>

    <!-- Pill 3: Child Safe -->
    <rect x="500" y="0" width="250" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="525" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#4ade80">✓ 100%</text>
    <text x="590" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">Child-Safe Classrooms</text>

    <!-- Right CTA Badge -->
    <rect x="790" y="0" width="210" height="52" rx="26" fill="url(#goldGradient)"/>
    <text x="895" y="33" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#090b10" text-anchor="middle">Book Free Trial ♟</text>
  </g>
</svg>
